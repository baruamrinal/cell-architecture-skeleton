name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: lint-type-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Real Postgres and Redis for the adapter tests (A41, A42-A49 on PostgreSQL and the
    # storage contract tests); without them those tests are skipped. Throwaway, CI-only
    # credentials on a job-local network.
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_USER: cellarch
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cellarch" --health-interval 2s
          --health-timeout 5s --health-retries 15
      redis:
        image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 5s --health-retries 15
    env:
      POSTGRES_URL: postgresql://cellarch:ci-only@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Install Helm (chart tests)
        uses: azure/setup-helm@v4
        with:
          version: v4.3.1

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Test (branch coverage gate >= 90%)
        run: pytest --cov --cov-report=term-missing

  docker-build:
    # Native runners per architecture (free for public repos): no slow QEMU emulation.
    name: docker-build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build one image per component, each non-root
        run: |
          for target in router control-plane cell-gateway user-account order-processing; do
            docker build --target "$target" --tag "cellarch/$target:ci" .
            test "$(docker run --rm --entrypoint id "cellarch/$target:ci" -u)" = "10001"
          done

  k3d-smoke:
    # The real local runtime: a platform cluster + one cluster per cell (make up), then
    # the end-to-end demo against it.
    name: k3d-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      K3D_VERSION: v5.9.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1

      - name: Install k3d (pinned release, checksum verified)
        run: |
          base="https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}"
          curl -sSfL "$base/k3d-linux-amd64" -o k3d
          curl -sSfL "$base/checksums.txt" -o checksums.txt
          tr -d '\r' < checksums.txt | awk '$NF ~ /k3d-linux-amd64$/ {print $1"  k3d"}' > k3d.sha256
          test -s k3d.sha256 || { echo "k3d-linux-amd64 not found in checksums.txt"; cat checksums.txt; exit 1; }
          sha256sum -c k3d.sha256
          sudo install -m 0755 k3d /usr/local/bin/k3d
          k3d version

      - name: make up (clusters, images, charts)
        run: python scripts/dev.py up

      - name: Run demo against the platform
        run: .venv/bin/python scripts/demo.py

      - name: Show cluster state on failure
        if: failure()
        run: |
          for ctx in $(kubectl config get-contexts -o name | grep cellarch); do
            echo "=== $ctx"; kubectl --context "$ctx" get pods -A -o wide
            kubectl --context "$ctx" logs -l app.kubernetes.io/part-of=cellarch --all-containers --tail 50 || true
          done

      - name: Delete clusters
        if: always()
        run: python scripts/dev.py clean
