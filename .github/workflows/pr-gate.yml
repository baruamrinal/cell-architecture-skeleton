# PR policy gate: github-actions[bot] approves a PR only when rules R1-R5 pass
# (docs/plan.md §9.1).
#
# Security: both triggers run this workflow as defined on `main`, with `main`'s code.
# The PR's code is never checked out or executed here, so a PR cannot change the rules
# that approve it.

name: PR gate

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    # Re-evaluate when the title changes or a draft becomes ready.
    types: [edited, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    name: pr-gate
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request')
      || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main (trusted gate code, never the PR)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Evaluate and approve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ci/pr_gate.py
