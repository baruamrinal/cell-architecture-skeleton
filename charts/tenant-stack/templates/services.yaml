{{- $tenant := include "stack.tenant" . -}}
{{- $secret := printf "tenant-%s" $tenant -}}
{{- $resources := required "tier must be standard or premium" (get .Values.resources .Values.tier) -}}
{{- range $service := list "user-account" "order-processing" }}
{{- $ctx := dict "root" $ "service" $service }}
{{- $name := include "stack.name" $ctx }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "stack.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ $.Values.replicas }}
  selector:
    matchLabels:
      {{- include "stack.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stack.labels" $ctx | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: {{ $service }}
          image: {{ $.Values.image.repository }}/{{ $service }}:{{ $.Values.image.tag }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: TENANT_ID
              value: {{ $tenant | quote }}
            - name: STACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: stack-token
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $service }}-database-url
            {{- if eq $service "order-processing" }}
            - name: USER_ACCOUNT_URL
              value: "http://{{ include "stack.name" (dict "root" $ "service" "user-account") }}:8000"
            {{- end }}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 3
          resources:
            {{- toYaml $resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "stack.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "stack.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
{{- end }}
