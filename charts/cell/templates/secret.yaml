{{- if .Values.secrets.create }}
{{- $name := include "cell.fullname" . -}}
{{- /* Generate the database password once; reuse it on every upgrade. */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := randAlphaNum 32 -}}
{{- if and $existing $existing.data (hasKey $existing.data "postgres-password") -}}
{{- $password = index $existing.data "postgres-password" | b64dec -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cell.fullname" . }}
  labels:
    {{- include "cell.labels" (dict "root" . "component" "cell") | nindent 4 }}
type: Opaque
stringData:
  internal-token: {{ required "secrets.internalToken is required" .Values.secrets.internalToken | quote }}
  postgres-password: {{ $password | quote }}
{{- end }}
