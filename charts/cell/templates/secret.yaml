{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cell.fullname" . }}
  labels:
    {{- include "cell.labels" (dict "root" . "component" "cell") | nindent 4 }}
type: Opaque
stringData:
  internal-token: {{ required "secrets.internalToken is required" .Values.secrets.internalToken | quote }}
{{- end }}
