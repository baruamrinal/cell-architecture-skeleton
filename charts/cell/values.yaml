# One cell, in its own cluster. Install once per cell cluster.

cellId: ""                      # required, e.g. cell-1

image:
  repository: cellarch          # images are <repository>/<component>:<tag>
  tag: dev
  pullPolicy: IfNotPresent

# Required: the credential the control plane uses for this cell's /internal API.
# Locally `make up` / `cellctl cells deploy` set it; in production External Secrets.
# The database server's admin password is generated in the cluster and kept across
# upgrades; it never leaves the cell. An existingSecret needs both keys:
# internal-token, postgres-password and mgr-token.
secrets:
  create: true
  existingSecret: ""
  internalToken: ""

gateway:
  maxConcurrentRequests: 100
  # The cell's mgr (release "mgr", charts/mgr): the web UI's GraphQL backend.
  mgrUrl: http://mgr:8000
  service:
    type: LoadBalancer          # the cell's entry point: internal NLB in production,
    port: 8000                  # the cell cluster's load balancer on the private network locally
  persistence:
    size: 1Gi
    storageClass: ""
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

# The cell's database server: one database per tenant, a login per service.
# Production: the cell's own Aurora Serverless v2 cluster.
postgres:
  image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
  persistence:
    size: 2Gi
    storageClass: ""
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
