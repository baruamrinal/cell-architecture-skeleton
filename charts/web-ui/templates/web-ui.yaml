{{- $tag := required "image.tag is required (<version>-<commit>, from the versions file)" .Values.image.tag -}}
{{- define "webUi.labels" -}}
app.kubernetes.io/name: web-ui
app.kubernetes.io/instance: {{ .Release.Name }}
app.kubernetes.io/component: web-ui
app.kubernetes.io/part-of: cellarch
app.kubernetes.io/version: {{ .Values.image.tag | quote }}
app.kubernetes.io/managed-by: {{ .Release.Service }}
helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
{{- end -}}
{{- define "webUi.selector" -}}
app.kubernetes.io/instance: {{ .Release.Name }}
app.kubernetes.io/component: web-ui
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-ui
  labels:
    {{- include "webUi.labels" . | nindent 4 }}
data:
  config.json: |
    {{- toPrettyJson .Values.config | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
  labels:
    {{- include "webUi.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "webUi.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "webUi.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ .Values.config | toJson | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web-ui
          image: {{ .Values.image.repository }}/web-ui:{{ $tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
              readOnly: true
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: web-ui
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web-ui
  labels:
    {{- include "webUi.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "webUi.selector" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-ui
  labels:
    {{- include "webUi.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-ui
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-ui
  labels:
    {{- include "webUi.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "webUi.selector" . | nindent 6 }}
---
# Pages come only from the edge; static files need no outbound calls at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-ui
  labels:
    {{- include "webUi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "webUi.selector" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: edge
              app.kubernetes.io/part-of: cellarch
      ports:
        - {port: 8080, protocol: TCP}
  egress: []
