# Platform cluster: router (the only public entry point) and control plane, plus
# locally the edge proxy that stands in for the production ALB.

image:
  repository: cellarch          # images are <repository>/<component>:<tag>
  tag: dev
  pullPolicy: IfNotPresent

# Required. Locally `make up` fills these from .env; in production External Secrets
# provides them from Secrets Manager (set secrets.create=false and existingSecret).
secrets:
  create: true
  existingSecret: ""
  adminToken: ""
  routerToken: ""
  metricsToken: ""
  cellCredentials: {}           # cell-id: token, for seeded cells

router:
  replicas: 1                   # also ROUTER_REPLICAS: each replica enforces limit / replicas
  routeCacheTtlSeconds: 5
  service:
    type: ClusterIP             # behind the edge locally; behind the ALB in production
    port: 8000
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

controlPlane:
  seedCells: {}                 # cell-id: gateway URL, registered at startup
  defaultCellCapacity: 4
  targetUtilization: 0.75
  rateLimits:
    standard: "50:100"
    premium: "500:1000"
  service:
    type: ClusterIP
    port: 8000
  persistence:
    size: 1Gi
    storageClass: ""            # cluster default (local-path on k3d)
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

# Web UI sessions (docs/plan.md §2.4): the router takes the tenant from the host and
# checks it against a session token signed by the identity provider.
sessions:
  jwksUrl: http://dev-idp:8000/auth/.well-known/jwks.json   # dev identity provider locally
  issuer: http://localhost:8080/auth
  audience: cellarch-web
  baseDomain: localhost         # tenants' hosts: <tenant>.localhost (platform.com in prod)

# LOCAL STAND-IN for the production ALB's path rules: one port for every tenant host.
# /auth goes to the dev identity provider, / to the web UI (when installed), the API to
# the router. Off in production.
edge:
  enabled: true
  image: nginxinc/nginx-unprivileged:1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
  identityProviderUrl: http://dev-idp:8000
  # The web UI's static files (charts/web-ui). When set, / goes there and only /graphql,
  # /v1/ and /_router/ go to the router; when empty, everything but /auth goes to the router.
  webUiUrl: ""
  service:
    type: LoadBalancer          # k3d maps it to localhost:8080
    port: 8080
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 250m, memory: 128Mi}

redis:
  enabled: false                # shared rate limiter; routers fail open without it
  image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 250m, memory: 128Mi}
