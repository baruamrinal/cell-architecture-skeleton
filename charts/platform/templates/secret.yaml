{{- if .Values.secrets.create }}
{{- $credentials := list }}
{{- range $cell, $token := .Values.secrets.cellCredentials }}
{{- $credentials = append $credentials (printf "%s=%s" $cell $token) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform.fullname" . }}
  labels:
    {{- include "platform.labels" (dict "root" . "component" "platform") | nindent 4 }}
type: Opaque
stringData:
  admin-token: {{ required "secrets.adminToken is required" .Values.secrets.adminToken | quote }}
  router-token: {{ required "secrets.routerToken is required" .Values.secrets.routerToken | quote }}
  metrics-token: {{ required "secrets.metricsToken is required" .Values.secrets.metricsToken | quote }}
  cell-credentials: {{ join "," $credentials | quote }}
{{- end }}
