{{- if .Values.edge.enabled }}
{{- $fullname := include "platform.fullname" . -}}
# LOCAL STAND-IN for the production ALB (docs/plan.md §2.4): every tenant host
# (acme.localhost) on one port, routed by path. The Host header passes through
# unchanged, because the router takes the tenant from it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-edge
  labels:
    {{- include "platform.labels" (dict "root" . "component" "edge") | nindent 4 }}
data:
  default.conf: |
    server {
      listen 8080;
      server_tokens off;
      client_max_body_size 1m;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      location /auth/ {
        proxy_pass {{ .Values.edge.identityProviderUrl }};
      }
      {{- if .Values.edge.webUiUrl }}
      location /graphql {
        proxy_pass http://{{ $fullname }}-router:{{ .Values.router.service.port }};
      }
      location /v1/ {
        proxy_pass http://{{ $fullname }}-router:{{ .Values.router.service.port }};
      }
      location /_router/ {
        proxy_pass http://{{ $fullname }}-router:{{ .Values.router.service.port }};
      }
      location / {
        proxy_pass {{ .Values.edge.webUiUrl }};
      }
      {{- else }}
      location / {
        proxy_pass http://{{ $fullname }}-router:{{ .Values.router.service.port }};
      }
      {{- end }}
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-edge
  labels:
    {{- include "platform.labels" (dict "root" . "component" "edge") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "platform.selector" (dict "root" . "component" "edge") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "platform.labels" (dict "root" . "component" "edge") | nindent 8 }}
      annotations:
        checksum/config: {{ .Values.edge | toJson | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: edge
          image: {{ .Values.edge.image }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.edge.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/conf.d, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}-edge
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-edge
  labels:
    {{- include "platform.labels" (dict "root" . "component" "edge") | nindent 4 }}
spec:
  type: {{ .Values.edge.service.type }}
  selector:
    {{- include "platform.selector" (dict "root" . "component" "edge") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.edge.service.port }}
      targetPort: http
      protocol: TCP
---
# The edge is the local entry point.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-edge
  labels:
    {{- include "platform.labels" (dict "root" . "component" "edge") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "platform.selector" (dict "root" . "component" "edge") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - {port: 8080, protocol: TCP}
{{- end }}
