{{- $fullname := include "platform.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-router
  labels:
    {{- include "platform.labels" (dict "root" . "component" "router") | nindent 4 }}
spec:
  replicas: {{ .Values.router.replicas }}
  selector:
    matchLabels:
      {{- include "platform.selector" (dict "root" . "component" "router") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "platform.labels" (dict "root" . "component" "router") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: router
          image: {{ include "platform.image" (dict "root" . "component" "router") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "platform.containerSecurity" (dict "uid" 10001) | nindent 10 }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: CONTROL_PLANE_URL
              value: "http://{{ $fullname }}-control-plane:{{ .Values.controlPlane.service.port }}"
            {{- include "platform.secretEnv" (dict "root" . "name" "ROUTER_TOKEN" "key" "router-token") | nindent 12 }}
            {{- include "platform.secretEnv" (dict "root" . "name" "ROUTER_METRICS_TOKEN" "key" "metrics-token") | nindent 12 }}
            - name: ROUTER_REPLICAS
              value: {{ .Values.router.replicas | quote }}
            - name: ROUTE_CACHE_TTL_SECONDS
              value: {{ .Values.router.routeCacheTtlSeconds | quote }}
            - name: SESSION_JWKS_URL
              value: {{ .Values.sessions.jwksUrl | quote }}
            - name: SESSION_ISSUER
              value: {{ .Values.sessions.issuer | quote }}
            - name: SESSION_AUDIENCE
              value: {{ .Values.sessions.audience | quote }}
            - name: TENANT_BASE_DOMAIN
              value: {{ .Values.sessions.baseDomain | quote }}
            - name: RATE_LIMIT_BACKEND
              value: {{ ternary "redis" "memory" .Values.redis.enabled | quote }}
            {{- if .Values.redis.enabled }}
            - name: REDIS_URL
              value: "redis://{{ $fullname }}-redis:6379/0"
            {{- end }}
          livenessProbe:
            httpGet: {path: /_router/healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /_router/healthz, port: http}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.router.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-router
  labels:
    {{- include "platform.labels" (dict "root" . "component" "router") | nindent 4 }}
spec:
  type: {{ .Values.router.service.type }}
  selector:
    {{- include "platform.selector" (dict "root" . "component" "router") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.router.service.port }}
      targetPort: http
      protocol: TCP
