# Adds a third shared cell to the local platform (scale out).
#
#   docker compose -f deploy/docker-compose.yml -f deploy/cell-3.override.yml up -d --wait
#   cellctl cells register cell-3 http://cell-3:8000 --capacity 4
#
# The control plane is restarted with cell-3's credential added; existing tenants are
# kept (they live on volumes). Use the same two -f flags for later `down`/`logs` calls.

services:
  control-plane:
    environment:
      CELL_CREDENTIALS: cell-1=${CELL_1_TOKEN:-dev-cell-1-token},cell-2=${CELL_2_TOKEN:-dev-cell-2-token},cell-3=${CELL_3_TOKEN:-dev-cell-3-token}

  cell-3:
    image: cellarch:dev
    command: ["uvicorn", "cellarch.data_plane.cell.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      CELL_ID: cell-3
      CELL_DB_PATH: /data/cell-3.db
      CELL_INTERNAL_TOKEN: ${CELL_3_TOKEN:-dev-cell-3-token}
    volumes: [cell-3-data:/data]
    networks: [platform]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  cell-3-data:
