# web-ui: static files only (docs/plan.md §2.4). It calls nothing itself; the browser
# talks to /graphql and /auth on the same host, which the edge (ALB in production)
# sends elsewhere.
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;

  add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;

  # Runtime configuration (mounted by the chart): always fresh.
  location = /config.json {
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Built assets have content hashes in their names: cache them for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  # Single-page app: every other path is the app itself.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    try_files $uri /index.html;
  }
}
